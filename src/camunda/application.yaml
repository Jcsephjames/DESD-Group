# Adapted from Camunda's official lightweight 8.8 Docker Compose configuration.
# https://github.com/camunda/camunda-distributions/tree/80ebf43/docker-compose/versions/camunda-8.8
camunda:
  system:
    cpu-thread-count: 3
    io-thread-count: 3
  security:
    authentication:
      method: basic
      unprotectedApi: true
    authorizations:
      enabled: false
    initialization:
      users:
        - username: demo
          password: demo
          name: Demo User
          email: demo@example.test
      defaultRoles.admin.users:
        - demo
  database.index.numberOfReplicas: 0
  data:
    secondary-storage:
      type: elasticsearch
      elasticsearch:
        cluster-name: elasticsearch
        url: http://elasticsearch:9200
