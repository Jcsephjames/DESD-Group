# Development services. The backend currently runs an idle container.
services:
  camunda-deploy:
    image: python:3.13-slim
    command: ["python", "-B", "/resources/deploy.py"]
    volumes:
      - ./src/camunda:/resources:ro
    depends_on:
      camunda:
        condition: service_healthy
    restart: "no"

  camunda:
    image: camunda/camunda:8.8.44
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:26500:26500"
    volumes:
      - camunda_data:/usr/local/camunda/data
      - ./src/camunda/application.yaml:/usr/local/camunda/config/application.yaml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 &&
          printf "GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -n 1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' |
          grep -Eq '"status":"(green|yellow)"'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      # Development default; override with POSTGRES_PASSWORD in a root .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_dev}
      TZ: Europe/London
      PGTZ: Europe/London
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./src/frontend:/usr/share/nginx/html:ro

  backend:
    image: python:3.13-slim
    working_dir: /app
    # No backend application is implemented yet.
    command: ["sleep", "infinity"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      # Reserved API port; no application currently listens here.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src/backend:/app

  workers:
    build:
      context: ./src/workers
    working_dir: /app
    command: ["python", "runner.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CAMUNDA_REST_URL: http://camunda:8080/v2
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: marketplace
      PGUSER: marketplace
      PGPASSWORD: ${POSTGRES_PASSWORD:-marketplace_dev}
      PGTZ: Europe/London
    depends_on:
      camunda:
        condition: service_healthy
      database:
        condition: service_healthy
    volumes:
      - ./src/workers:/app

volumes:
  camunda_data:
  elasticsearch_data:
  postgres_data:

