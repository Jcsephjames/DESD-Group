# To launch the docker containes use `docker compose up -d`
# Service definitions go under services; named storage is declared at the bottom in the volumes section.
# Backend and worker startup commands are currently placeholders.
services:
  # One-off uploader: wait for Camunda, deploy the files, then exit.
  # This is used to deploy the BPMN and Forms to Camunda.
  camunda-deploy:
    image: python:3.13-slim
    command: ["python", "-B", "/resources/deploy.py"]
    volumes:
      - ./src/camunda:/resources:ro
    depends_on:
      camunda:
        condition: service_healthy
    restart: "no"

  # Runs the process engine, Tasklist and Operate.
  # Tasklist: http://localhost:8088/tasklist (development login: demo / demo). For Operate use http://localhost:8088/operate (development login: demo / demo).
  camunda:
    image: camunda/camunda:8.8.44
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m"
    # Host port 8088 forwards to port 8080 inside Camunda.
    ports:
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:26500:26500"
    volumes:
      # Attach the named storage declared in the bottom-level volumes section.
      - camunda_data:/usr/local/camunda/data
      # Compose starts the container; this file configures Camunda inside it.
      - ./src/camunda/application.yaml:/usr/local/camunda/config/application.yaml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    # Ask the management endpoint for HTTP 200 before allowing deployment.
    # Bash is used because the Camunda image does not require curl for this check.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 &&
          printf "GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -n 1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Camunda secondary storage; reachable internally at elasticsearch:9200.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' |
          grep -Eq '"status":"(green|yellow)"'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Stores marketplace data separately from Camunda process data.
  # This is for Marketplace database. Not currently used.
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      # Development default; override with POSTGRES_PASSWORD in a root .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_dev}
      TZ: Europe/London
      PGTZ: Europe/London
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Executed only when Postgres initializes an empty data volume.
      - ./src/database/init/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serves the local frontend files at http://localhost:8080. Maybe needed if we are creating a frontend / website
  frontend:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./src/frontend:/usr/share/nginx/html:ro

  backend:
    image: python:3.13-slim
    working_dir: /app
    # Replace with the API startup command once the backend exists.
    command: ["sleep", "infinity"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      # Reserved for the future API; nothing listens here yet.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src/backend:/app

  # Worker container; its current command keeps it idle until handlers are started.
  # This is used to process the messages from the Camunda process engine.
  # There is no kind of web socket to camunda it connects via Camunda's internal network (http://camunda:8080/v2)
  workers:
    build:
      context: ./src/workers
    working_dir: /app
    # Replace with the worker startup command once the workers exist.
    command: ["sleep", "infinity"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: marketplace
      PGUSER: marketplace
      PGPASSWORD: ${POSTGRES_PASSWORD:-marketplace_dev}
      PGTZ: Europe/London
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./src/workers:/app

# Declare named storage here; each service mounts it in its own volumes section.
# Data survives docker compose down; docker compose down -v deletes it.
volumes:
  camunda_data:
  elasticsearch_data:
  postgres_data:
